# Konfigurasi default Van de Booth.
# Urutan timpa: ./config.properties, <folder config pengguna>/config.properties (Mode Operator),
# lalu -Dvandebooth.<key>=... . "~" dan ${user.home} diganti dengan direktori home pengguna.
output.dir=~/VanDeBooth

# Nama dan tanggal acara (yyyy-MM-dd). Tanggal kosong = hari ini.
event.name=Sample event
event.date=

# Foto: batas retake per sesi, detik hitung mundur (2-5), jeda antar foto (0-5 detik).
maxRetakes=2
countdown.seconds=3
capture.pauseSeconds=1

# Pembayaran demo (tanpa gateway, tanpa jaringan).
payment.enabled=false
payment.price=25000

# Berbagi lewat jaringan lokal (QR). host kosong = deteksi IPv4 privat otomatis.
share.enabled=true
share.port=8080
share.host=
share.bindAddress=0.0.0.0
share.expiryHours=6

# Cetak: printer kosong = default sistem; layout single|two-up; mode system|file (file = PNG ke print-queue/).
print.printer=
print.maxCopies=2
print.layout=single
print.paper=4x6
print.mode=system

# Layout yang ditawarkan ke tamu (id dipisah koma, minimal satu). Kosong = semua enam.
layouts.offered=
