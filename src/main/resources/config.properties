# Konfigurasi default Van de Booth.
# Timpa dengan ./config.properties di direktori kerja atau -Dvandebooth.<key>=... (mis. -Dvandebooth.event.name=...)
# "~" dan ${user.home} diganti dengan direktori home pengguna.
output.dir=~/VanDeBooth

# Nama dan tanggal acara (yyyy-MM-dd). Tanggal kosong = hari ini.
event.name=Sample event
event.date=

# Batas retake per sesi untuk semua foto.
maxRetakes=2
