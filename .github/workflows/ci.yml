name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Tes Electron tidak dijalankan di CI; binari Electron tidak perlu diunduh
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Java tests and JAR
        run: ./mvnw -q verify

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest, Node)
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Chromium, synthetic test feed)
        run: node scripts/build.mjs && npx playwright test --project chromium

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
